#!/bin/bash

# Wiggly Speech-to-Text Configuration File
# This file contains shared configuration for all Wiggly STT scripts

# Model Configuration
MODEL_PATH="${HOME}/.models"
DEFAULT_MODEL="ggml-medium.bin" #use option below

#transcribe language
TRANSCRIBE_LANGUAGE="en"



# Audio Configuration
SAMPLE_RATE=16000

# File Paths
AUDIO_FILE="/tmp/whisper_recording_$(date +%s).wav"

# Daemon Configuration (Oneshot Mode)
DAEMON_DIR="/tmp/wiggly-stt-daemon"
PID_FILE="$DAEMON_DIR/daemon.pid"
DAEMON_AUDIO_FILE="$DAEMON_DIR/continuous_recording.wav"
LOG_FILE="$DAEMON_DIR/daemon.log"

# Server Configuration (Whisper Server Mode)
SERVER_DIR="/tmp/wiggly-stt-server"
SERVER_PID_FILE="$SERVER_DIR/server.pid"
SERVER_LOG_FILE="$SERVER_DIR/server.log"
SERVER_HOST="127.0.0.1"
SERVER_PORT="8080"
SERVER_THREADS=4

# Auto-paste Configuration
AUTO_PASTE_FLAG=false      # Global flag for auto-paste

# Colors for output
RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
BLUE='\033[0;34m'
CYAN='\033[0;36m'
NC='\033[0m'  # No Color

# Model URLs for downloading
MODEL_BASE_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main"

# Available models (comment/uncomment to change default options)
AVAILABLE_MODELS=(
    "ggml-tiny.en.bin"       # ~39 MB, fastest, lowest accuracy
    "ggml-base.en.bin"       # ~142 MB, fast, good accuracy
    "ggml-small.en.bin"      # ~466 MB, balanced, good accuracy
    "ggml-medium.en.bin"     # ~1.5 GB, slower, better accuracy
    "ggml-large-v3.bin"      # ~3.1 GB, slowest, best accuracy
    "ggml-large-v3-turbo.bin" # ~3.1 GB, faster large model
)

# Dependencies to check
REQUIRED_DEPS=(
    "ffmpeg"
    "wl-copy"
    "notify-send"
    "curl"
    "whisper-server"
)

# Optional dependencies
OPTIONAL_DEPS=(
    "ydotool"  # for auto-paste functionality
)

# Whisper executable names to try (in order of preference)
WHISPER_EXECUTABLES=(
    "whisper-cli"
    "whisper"
    "main"
) 